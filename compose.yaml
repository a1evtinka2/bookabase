services:
  db:
    image: postgres:17
    container_name: bookabase-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bookabase
    volumes:
      - bookabase_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookabase"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bookabase_pgdata: